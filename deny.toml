# cargo-deny policy: `cargo deny check` (CI runs it on every push).
# Every dependency must be under a license that allows OpenXER to be
# distributed as MIT OR Apache-2.0.

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    # Fonts bundled by egui's default font set; notices go in THIRD_PARTY.md.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path without a version; they
# are not published (publish = false), so those path dependencies are allowed.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
