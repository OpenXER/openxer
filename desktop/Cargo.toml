[package]
name = "openxer-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "OpenXER"
path = "src/main.rs"

[dependencies]
openxer-engine = { path = "../engine" }
openxer-xer = { path = "../xer" }
openxer-interchange = { path = "../interchange" }
openxer-automation = { path = "../automation" }
openxer-chat = { path = "../chat" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "=0.33.3", features = ["datepicker"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rfd = "=0.15.4"
chrono = "0.4.42"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pdf-writer = "=0.15.0"
miniz_oxide = "=0.8.9"

# The window backends Linux needs; Windows builds keep the feature set above.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
# The fake sign-in service and API server, for the Chat tests.
openxer-chat = { path = "../chat", features = ["testkit"] }
