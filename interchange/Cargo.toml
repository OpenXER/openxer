[package]
name = "openxer-interchange"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openxer-engine = { path = "../engine" }
openxer-xer = { path = "../xer" }
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
rust_xlsxwriter = { version = "=0.102.0", default-features = false }
calamine = { version = "=0.38.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
